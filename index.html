<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Hospital - Slot Booking</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f7fb;color:#17324d}
.header{background:#087f8c;color:white;padding:28px 20px;text-align:center}
.header h1{margin:0;font-size:32px}.header p{margin:8px 0 0}
.container{max-width:700px;margin:25px auto;padding:0 16px}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 5px 20px #00000012;margin-bottom:18px}
label{display:block;font-weight:bold;margin:14px 0 7px}
select,input{width:100%;padding:12px;border:1px solid #cbd8df;border-radius:9px;font-size:16px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.slot{padding:12px;border:1px solid #087f8c;background:white;color:#087f8c;border-radius:9px;cursor:pointer}
.slot:hover,.slot.selected{background:#087f8c;color:white}
.slot.booked{background:#ddd;color:#888;border-color:#ddd;cursor:not-allowed}
button.confirm{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#087f8c;color:white;font-size:17px;font-weight:bold;cursor:pointer}
.confirmation{display:none;text-align:center}
.confirmation .number{font-size:42px;font-weight:bold;color:#087f8c}
.qr{text-align:center}.qr img{width:190px;max-width:100%}
.small{color:#607585;font-size:14px}
@media(max-width:500px){.slots{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="header">
  <h1>🏥 ABC Hospital</h1>
  <p>Online Doctor Slot Booking</p>
</div>

<div class="container">
  <div class="card">
    <h2>Book Your Appointment</h2>

    <label for="doctor">Select Doctor</label>
    <select id="doctor">
      <option>Dr. Priya - General Medicine</option>
      <option>Dr. Arun - Cardiology</option>
      <option>Dr. Meena - Pediatrics</option>
    </select>

    <label for="date">Select Date</label>
    <input type="date" id="date">

    <label>Available Time Slots</label>
    <div class="slots" id="slots"></div>

    <label for="name">Patient Name</label>
    <input id="name" type="text" placeholder="Enter patient name">
    <label for="phone">WhatsApp Phone Number</label>
<input
  type="tel"
  id="phone"
  placeholder="Enter phone number with country code"
  required
>

    <button type="button" onclick="window.bookSlot()">Confirm Slot</button>
  </div>

  <div class="card confirmation" id="confirmation">
    <h2>Appointment Confirmed ✅</h2>
    <p>Your token / slot number is</p>
    <div class="number" id="token"></div>
    <p id="details"></p>
    <p class="small">Please arrive 10 minutes before your appointment.</p>
  </div>

  <div class="card qr">
    <h3>Scan to Open Booking Page</h3>
    <img src="abc_hospital_qr.png" alt="ABC Hospital QR Code">
    <p class="small">Use your phone camera to scan the QR code.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getDatabase,
  ref,
  push,
  set,
  get
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD9FwQgnxiKnV2WWAPiEkhHhUDjwG5yejo",
  authDomain: "hospitalqueuesystem-2a2b6.firebaseapp.com",
  databaseURL: "https://hospitalqueuesystem-2a2b6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hospitalqueuesystem-2a2b6",
  storageBucket: "hospitalqueuesystem-2a2b6.firebasestorage.app",
  messagingSenderId: "834228939550",
  appId: "1:834228939550:web:b66811bfe5f2485da0370f",
  measurementId: "G-BJW8PZX65D"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;

const slots = [
  "09:00 AM", "09:30 AM", "10:00 AM", "10:30 AM",
  "11:00 AM", "11:30 AM", "02:00 PM", "02:30 PM",
  "03:00 PM", "03:30 PM", "04:00 PM", "04:30 PM"
];

let selectedSlot = "";

const dateInput = document.getElementById("date");
dateInput.value = new Date().toLocaleDateString("en-CA");
renderSlots();

dateInput.addEventListener("change", renderSlots);
document.getElementById("doctor").addEventListener("change", renderSlots);

signInAnonymously(auth)
  .then((result) => {
    currentUser = result.user;
    console.log("Firebase connected. Anonymous user signed in.");
  })
  .catch((error) => {
    console.error("Firebase authentication failed:", error);
    alert("Could not connect to the booking service. Please try again.");
  });

function renderSlots() {
  const box = document.getElementById("slots");
  box.innerHTML = "";
  selectedSlot = "";

  slots.forEach((time, i) => {
    const b = document.createElement("button");
    b.className = "slot";
    b.textContent = time;

    // Temporary demo: two slots appear booked today.
    if (
      (i === 2 || i === 7) &&
      dateInput.value === new Date().toLocaleDateString("en-CA")
    ) {
      b.className += " booked";
      b.disabled = true;
      b.title = "Already booked";
    } else {
      b.onclick = () => {
        document.querySelectorAll(".slot").forEach(
          x => x.classList.remove("selected")
        );
        b.classList.add("selected");
        selectedSlot = time;
      };
    }

    box.appendChild(b);
  });
}

async function bookSlot() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const doctor = document.getElementById("doctor").value;
  const date = dateInput.value;
const phone = document.getElementById("phone").value.trim();
if (!name || !phone || !selectedSlot || !date) {
  alert("Please enter your name and phone number, select a date and choose a time slot.");
  return;
}

  if (!currentUser) {
    alert("The booking service is connecting. Please try again in a moment.");
    return;
  }

const bookingsRef = ref(db, "bookings/" + currentUser.uid);
const snapshot = await get(bookingsRef);
const previousBookings = snapshot.val() || {};
const tokenNumber = Object.keys(previousBookings).length + 1;
const token = String(tokenNumber);
const waitingMinutes = (tokenNumber - 1) * 5;
  const booking = {
    token: token,
    patientName: name,
    patientPhone:phone,
    doctor: doctor,
    date: date,
    time: selectedSlot,
    status: "booked",
    createdAt: new Date().toISOString()
  };

  try {
    const bookingRef = push(
      ref(db, "bookings/" + currentUser.uid)
    );

    await set(bookingRef, booking);

    document.getElementById("token").textContent = token;

    const details = document.getElementById("details");
    details.replaceChildren();

    const nameLine = document.createElement("b");
    nameLine.textContent = name;
    details.appendChild(nameLine);
    details.appendChild(document.createElement("br"));
    details.appendChild(document.createTextNode(doctor));
    details.appendChild(document.createElement("br"));
    details.appendChild(document.createTextNode("Date: " + date));
    details.appendChild(document.createElement("br"));
    details.appendChild(document.createTextNode("Time: " + selectedSlot));
    const message =
  "Hello " + name + "! Your appointment is booked.\n\n" +
  "Token number: " + token + "\n" +
  "Doctor: " + doctor + "\n" +
  "Date: " + date + "\n" +
  "Time: " + selectedSlot + "\n" +
  "Estimated waiting time: " + waitingMinutes + " minutes\n\n" +
  "Please be available when your turn approaches.";

let whatsappLink = document.getElementById("whatsappLink");

if (!whatsappLink) {
  whatsappLink = document.createElement("a");
  whatsappLink.id = "whatsappLink";
  whatsappLink.textContent = "Send appointment details on WhatsApp";
  whatsappLink.target = "_blank";
  whatsappLink.rel = "noopener noreferrer";
  whatsappLink.style.display = "block";
  whatsappLink.style.marginTop = "15px";
  document.getElementById("confirmation").appendChild(whatsappLink);
}

whatsappLink.href =
  "https://wa.me/?text=" + encodeURIComponent(message);
    document.getElementById("confirmation").style.display = "block";
    document.getElementById("confirmation").scrollIntoView({
      behavior: "smooth"
    });

    console.log("Booking saved to Firebase:", bookingRef.key);
  } catch (error) {
    console.error("Booking save failed:", error);
    alert("Booking could not be saved. Please check the Firebase connection.");
  }
}

window.bookSlot = bookSlot;
</script>

</body>
</html>
