
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital - Receptionist Dashboard</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  color: #1e293b;
}
header {
  background: #0f3d66;
  color: white;
  padding: 20px;
  text-align: center;
}
main {
  max-width: 900px;
  margin: 25px auto;
  padding: 16px;
}
.card {
  background: white;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #0001;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
.stat {
  background: #eaf2fa;
  padding: 18px;
  border-radius: 10px;
  text-align: center;
}
.stat h2 {
  font-size: 30px;
  margin: 5px;
}
.patient {
  border: 1px solid #cbd5e1;
  padding: 15px;
  border-radius: 10px;
  margin-top: 12px;
}
button {
  padding: 10px;
  margin: 5px 4px 0 0;
  border: 0;
  border-radius: 6px;
  background: #1769aa;
  color: white;
  cursor: pointer;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.status {
  font-weight: bold;
  color: #1769aa;
}
#message {
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
<h1>Hospital</h1>
<p>Receptionist Dashboard</p>
</header>

<main>

<section class="card">
<h2>Live Queue Status</h2>

<div class="stats">
  <div class="stat">
    <h2 id="currentToken">--</h2>
    Current Token
  </div>

  <div class="stat">
    <h2 id="peopleWaiting">--</h2>
    People Waiting
  </div>
</div>

<p id="message">Connecting to Firebase...</p>
</section>

<section class="card">
<h2>Patient Bookings</h2>
<div id="patientList">Loading bookings...</div>
</section>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD9FwQgnxiKnV2WWAPiEkhHhUDjwG5yejo",
  authDomain: "hospitalqueuesystem-2a2b6.firebaseapp.com",
  databaseURL: "https://hospitalqueuesystem-2a2b6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hospitalqueuesystem-2a2b6",
  storageBucket: "hospitalqueuesystem-2a2b6.firebasestorage.app",
  messagingSenderId: "834228939550",
  appId: "1:834228939550:web:b66811bfe5f2485da0370f",
  measurementId: "G-BJW8PZX65D"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const patientList = document.getElementById("patientList");
const message = document.getElementById("message");

let allBookings = [];

async function startDashboard() {
  try {
    await signInAnonymously(auth);

    message.textContent = "Connected to Firebase!";

    // Listen to queue status
    // Listen to all patient bookings
    onValue(ref(db, "bookings"), snapshot => {

      const data = snapshot.val() || {};
      allBookings = [];

      Object.entries(data).forEach(([uid, userBookings]) => {
        Object.entries(userBookings || {}).forEach(
          ([bookingId, booking]) => {

            allBookings.push({
              uid,
              bookingId,
              ...booking
            });

          }
        );
      });

      allBookings.sort((a, b) =>
        String(a.token || "").localeCompare(
          String(b.token || ""),
          undefined,
          { numeric: true }
        )
      );

      renderPatients();

    }, error => {
      message.textContent = "Database error: " + error.message;
    });

  } catch (error) {
    message.textContent = "Connection failed: " + error.message;
  }
}

function renderPatients() {

  patientList.replaceChildren();

  if (allBookings.length === 0) {
    patientList.textContent = "No patient bookings found.";
    updateWaiting();
    return;
  }

  allBookings.forEach(patient => {

    const card = document.createElement("div");
    card.className = "patient";

    const name = document.createElement("h3");
    name.textContent = patient.patientName || "Unknown patient";

    const details = document.createElement("p");
    details.textContent =
      "Token: " + (patient.token || "--") +
      " | Doctor: " + (patient.doctor || "--") +
      " | Date: " + (patient.date || "--") +
      " | Time: " + (patient.time || "--");

    const status = document.createElement("p");
    status.className = "status";
    status.textContent = "Status: " + (patient.status || "booked");

    card.append(name, details, status);

    addAction(card, "Mark Arrived", patient, "arrived",
      patient.status === "booked");

    addAction(card, "Start Consultation", patient,
      "in_consultation", patient.status === "arrived");

    addAction(card, "Complete Consultation", patient,
      "completed", patient.status === "in_consultation");

    patientList.appendChild(card);

  });

  updateWaiting();
}

function addAction(card, label, patient, newStatus, enabled) {

  const button = document.createElement("button");
  button.textContent = label;
  button.disabled = !enabled;

  button.addEventListener("click", async () => {

    button.disabled = true;

    try {
      const bookingRef = ref(
        db,
        `bookings/${patient.uid}/${patient.bookingId}`
      );

      const timestamp = Date.now();

      const changes = {
        status: newStatus
      };

      if (newStatus === "arrived") {
        changes.arrivedAt = timestamp;
      }

      if (newStatus === "in_consultation") {
        changes.consultationStartedAt = timestamp;

        await update(ref(db, "queueStatus"), {
          currentToken: patient.token
        });
      }

      if (newStatus === "completed") {
        changes.consultationCompletedAt = timestamp;
      }

      await update(bookingRef, changes);

    } catch (error) {
      alert("Update failed: " + error.message);
      button.disabled = false;
    }

  });

  card.appendChild(button);
}


function getTodayDate() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function getTokenNumber(token) {
  const match = String(token || "").match(/\d+/);
  return match ? Number(match[0]) : 0;
}


function updateWaiting() {

  const today = getTodayDate();

  const todayBookings = allBookings.filter(patient =>
    patient.date === today
  );

  // Find the latest consultation started
  const servedPatients = todayBookings
    .filter(patient =>
      patient.consultationStartedAt &&
      ["in_consultation", "completed"].includes(patient.status)
    )
    .sort((a, b) =>
      Number(a.consultationStartedAt) -
      Number(b.consultationStartedAt)
    );

  const latestPatient = servedPatients.length
    ? servedPatients[servedPatients.length - 1]
    : null;

  const currentToken = latestPatient
    ? getTokenNumber(latestPatient.token)
    : 0;

  // Count patients still waiting
  const waiting = todayBookings.filter(patient =>
    ["booked", "arrived"].includes(patient.status || "booked")
  ).length;

  document.getElementById("currentToken").textContent =
    currentToken;

  document.getElementById("peopleWaiting").textContent =
    waiting;

  update(ref(db, "queueStatus"), {
    currentToken: currentToken,
    peopleWaiting: waiting
  }).catch(error => {
    message.textContent = "Queue update failed: " + error.message;
  });
}


startDashboard();

</script>

</body>
</html>
